<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロフィール閲覧数</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .view-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .count {
      font-weight: bold;
      font-size: 1.2em;
      color: #007bff;
    }
  </style>
</head>
<body>

  <div class="view-card">
    <p>現在のプロフィール閲覧数: <span id="view-count" class="count">---</span> 回</p>
  </div>

  <script>
    // 1,200 〜 3,500 の間でランダムな数値を生成して表示
    const min = 1200;
    const max = 3500;
    const randomCount = Math.floor(Math.random() * (max - min + 1)) + min;
    
    document.getElementById('view-count').textContent = randomCount.toLocaleString();
  </script>

</body>
</html>
